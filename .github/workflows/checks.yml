# Runs on every push and pull request. Catches broken scripts, dead links and
# committed secrets before they reach ladslb.org.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run site checks
        run: python3 tools/check.py
